<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rohan's Pit Stop HQ</title><style>:root{--bg:#070809;--panel:#111516;--line:#30383b;--text:#f7f7f7;--muted:#aeb5b8;--red:#e10600;--yellow:#ffd600;--green:#1ea87a;--blue:#286de8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#5b0a06,transparent 28%),var(--bg);color:var(--text);font-family:Arial,sans-serif}.top{padding:18px;background:#0b0d0e;border-bottom:3px solid var(--red)}.topin{max-width:1250px;margin:auto;display:flex;justify-content:space-between;align-items:center}.badge{background:var(--yellow);color:#111;font-weight:900;padding:7px 10px;display:inline-block}h1{margin:8px 0 0;font-size:clamp(2rem,6vw,4rem);font-style:italic}.ham{font-weight:900;text-align:right}.ham b{font-size:2.5rem;color:var(--yellow)}main{max-width:1250px;margin:auto;padding:14px}.quote,.news,section{background:var(--panel);border:1px solid var(--line);border-radius:14px}.quote{padding:18px;margin-bottom:12px}.quote small{color:var(--yellow);font-weight:bold}.quote h2{margin:7px 0;font-style:italic}.quote p{margin:0;color:var(--muted)}.news{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;overflow:hidden;margin-bottom:12px}.news a{padding:14px;color:#fff;text-decoration:none;min-height:90px;background:#111516}.tag{display:block;color:var(--yellow);font-size:.7rem;font-weight:bold;margin-bottom:8px}.controls{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0}.group{display:flex;gap:8px;align-items:center}button{border:1px solid #3a4548;background:#182023;color:#fff;padding:10px 13px;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:var(--red);border-color:var(--red)}.template{background:var(--yellow);color:#111;border-color:var(--yellow)}#week{font-weight:bold;min-width:170px;text-align:center}.gridwrap{overflow:auto}.grid{display:grid;grid-template-columns:68px repeat(7,minmax(120px,1fr));min-width:908px;position:relative}.head{height:42px;background:#171d1f;display:grid;place-items:center;font-weight:bold;font-size:.75rem;border-bottom:1px solid var(--line)}.time,.slot{height:36px;border-bottom:1px solid #242b2d}.time{font-size:.72rem;color:var(--muted);padding:10px 7px;text-align:right}.slot{border-left:1px solid #242b2d}.event{position:absolute;z-index:2;border-radius:6px;padding:5px 7px;font-size:.72rem;font-weight:bold;overflow:hidden;cursor:pointer}.school{background:#775c00}.cricket{background:#176f62}.rugby{background:#9d1717}.homework{background:#2058aa}.study{background:#6c43a5}.other{background:#465055}.mobile{display:none}.tabs{display:flex;overflow:auto;gap:6px;margin-bottom:8px}.tabs button.active{background:var(--red)}.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.item{padding:14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:60px 1fr auto;gap:8px}.item small{color:var(--muted)}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:12px;z-index:10}.modal.show{display:grid}.dialog{width:min(480px,100%);background:#111718;border:1px solid #414b4e;border-radius:14px;padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:.7rem;color:var(--muted);font-weight:bold}.full{grid-column:1/-1}input,select,textarea{width:100%;margin-top:4px;background:#090b0c;color:#fff;border:1px solid #394447;border-radius:7px;padding:10px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.delete{margin-right:auto;background:#571515}.fab{display:none}@media(max-width:700px){.ham{display:none}.news{grid-template-columns:1fr}.gridwrap{display:none}.mobile{display:block}.fab{display:block;position:fixed;right:16px;bottom:16px;width:58px;height:58px;border-radius:50%;font-size:1.6rem;background:var(--red);border:0}.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="top"><div class="topin"><div><span class="badge">ROHAN • FERRARI MODE</span><h1>Rohan's Pit Stop HQ</h1></div><div class="ham"><b>44</b><br>LEWIS HAMILTON • FERRARI</div></div></header><main><div class="quote"><small id="qlabel">TODAY'S RACE PLAN</small><h2 id="qtitle"></h2><p id="qtext"></p></div><div class="news"><a id="bbc" href="https://www.bbc.com/news" target="_blank"><span class="tag">BBC NEWS</span><b>Latest BBC headline — tap to read</b></a><a id="f1" href="https://www.formula1.com/en/latest" target="_blank"><span class="tag">F1 LATEST</span><b>Latest Formula 1 news — tap to read</b></a><a id="cricket" href="https://www.bbc.com/sport/cricket" target="_blank"><span class="tag">CRICKET</span><b>Latest cricket news — tap to read</b></a></div><div class="controls"><div class="group"><button id="prev">‹</button><b id="week"></b><button id="next">›</button><button id="today">Today</button></div><div class="group"><button class="template" id="editTemplate">📋 Edit Template</button><button class="primary" id="add">+ Add Activity</button></div></div><section class="gridwrap"><div id="grid" class="grid"></div></section><section class="mobile"><div id="tabs" class="tabs"></div><div id="list" class="list"></div></section></main><button id="fab" class="fab">+</button><div id="modal" class="modal"><div class="dialog"><h2 id="mtitle">Add Activity</h2><div class="form"><label class="full">NAME<input id="name"></label><label>DAY<select id="day"></select></label><label>TYPE<select id="type"><option>school</option><option>cricket</option><option>rugby</option><option>homework</option><option>study</option><option>other</option></select></label><label>START<input id="start" type="time"></label><label>END<input id="end" type="time"></label><label class="full">NOTES<textarea id="notes"></textarea></label></div><div class="actions"><button id="del" class="delete">Delete</button><button id="cancel">Cancel</button><button id="save" class="primary">Save</button></div></div></div><script>const D=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let week=0,selected=0,editing=null,templateMode=false;let activities=JSON.parse(localStorage.getItem('rohan_week_v3')||'null')||[];let template=JSON.parse(localStorage.getItem('rohan_template_v3')||'null')||D.map((_,i)=>i<5?{day:i,name:'School',type:'school',start:'07:30',end:'16:00',notes:''}:null).filter(Boolean);const quotes=[['START THE ENGINE.','The hardest part is starting. Do the first important thing now.'],['MAKE THE LAP COUNT.','You have the same 24 hours as everyone else. Use your next hour better than your last.'],['NO TRAFFIC ON THE EXTRA MILE.','One focused session today can put you ahead of yesterday.'],['BOX BOX. WHAT’S NEXT?','Finish the task. Reset. Then attack the next one.'],['YOUR FUTURE SELF IS WATCHING.','Don’t waste today hoping tomorrow will be different. Build different today.'],['CONSISTENCY BEATS MOOD.','You do not need to feel like it. You only need to start.'],['44 REASONS? NO EXCUSES.','Champions are made in ordinary sessions when nobody is watching.']];function mins(t){let a=t.split(':').map(Number);return a[0]*60+a[1]}function baseMonday(){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+week*7);return d}function label(){let d=baseMonday(),e=new Date(d);e.setDate(e.getDate()+6);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+e.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}function saveData(){localStorage.setItem('rohan_week_v3',JSON.stringify(activities));localStorage.setItem('rohan_template_v3',JSON.stringify(template))}function all(day){return [...template.filter(x=>x.day===day).map(x=>({...x,template:true})),...activities.filter(x=>x.week===week&&x.day===day)].sort((a,b)=>mins(a.start)-mins(b.start))}function quote(){let i=(new Date().getDate()+new Date().getHours())%quotes.length;qtitle.textContent=quotes[i][0];qtext.textContent=quotes[i][1]}function render(){document.getElementById('week').textContent=label();let g=grid;g.innerHTML='<div class="head">TIME</div>'+D.map((x,i)=>'<div class="head">'+x+' '+new Date(baseMonday().getTime()+i*864e5).getDate()+'</div>').join('');for(let m=390;m<1320;m+=30){g.innerHTML+='<div class="time">'+String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+'</div>'+D.map((_,i)=>'<div class="slot" onclick="openNew('+i+',\''+String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+'\')"></div>').join('')}for(let i=0;i<7;i++)for(let a of all(i)){let top=42+(Math.max(390,mins(a.start))-390)/30*36,left=(i+1)*12.5;let e=document.createElement('div');e.className='event '+a.type;e.style.cssText='left:calc('+left+'% + 4px);width:calc(12.5% - 8px);top:'+top+'px;height:'+Math.max(26,(mins(a.end)-mins(a.start))/30*36-4)+'px';e.textContent=(a.template?'📌 ':'')+a.name;e.onclick=()=>edit(a);g.appendChild(e)}renderMobile()}function renderMobile(){tabs.innerHTML=D.map((x,i)=>'<button class="'+(i===selected?'active':'')+'" onclick="selectDay('+i+')">'+x+'</button>').join('');let x=all(selected);list.innerHTML=x.length?x.map(a=>'<div class="item" onclick="editByName('+selected+',\''+a.name.replace(/'/g,'')+'\',\''+(a.template?'t':'a')+'\')"><b>'+a.start+'</b><div><b>'+(a.template?'📌 ':'')+a.name+'</b><br><small>'+a.end+' • '+a.type+'</small></div><b>›</b></div>').join(''):'<div class="item"><div></div><div><b>Nothing planned yet</b><br><small>Tap + to plan your day.</small></div></div>'}function selectDay(i){selected=i;renderMobile()}function openNew(day=selected,start='16:00'){editing=null;templateMode=false;mtitle.textContent='Add Activity';name.value='';window.day.value=day;type.value='other';window.start.value=start;end.value='17:00';notes.value='';del.style.display='none';modal.classList.add('show')}function edit(a){editing=a;templateMode=!!a.template;mtitle.textContent=templateMode?'Edit Template Activity':'Edit Activity';name.value=a.name;window.day.value=a.day;type.value=a.type;window.start.value=a.start;end.value=a.end;notes.value=a.notes||'';del.style.display='block';modal.classList.add('show')}function editByName(d,n,k){let a=(k==='t'?template:activities.filter(x=>x.week===week)).find(x=>x.day===d&&x.name===n);edit(k==='t'?{...a,template:true}:a)}function openTemplate(){templateMode=true;editing=null;mtitle.textContent='Add / Edit Regular Template';name.value='School';window.day.value=0;type.value='school';window.start.value='07:30';end.value='16:00';notes.value='Regular school day';del.style.display='none';modal.classList.add('show')}for(let i=0;i<7;i++)day.innerHTML+='<option value="'+i+'">'+D[i]+'</option>';save.onclick=()=>{let a={week,day:+window.day.value,name:name.value||'Activity',type:type.value,start:window.start.value,end:end.value,notes:notes.value};if(templateMode){if(editing){let i=template.findIndex(x=>x===editing||x.day===editing.day&&x.name===editing.name&&x.start===editing.start);if(i>=0)template[i]=a}else template.push(a)}else{if(editing){let i=activities.indexOf(editing);if(i>=0)activities[i]=a}else activities.push(a)}saveData();modal.classList.remove('show');render()};del.onclick=()=>{if(!editing)return;if(templateMode)template=template.filter(x=>x.day!==editing.day||x.name!==editing.name||x.start!==editing.start);else activities=activities.filter(x=>x!==editing);saveData();modal.classList.remove('show');render()};cancel.onclick=()=>modal.classList.remove('show');add.onclick=()=>openNew();fab.onclick=()=>openNew();editTemplate.onclick=openTemplate;prev.onclick=()=>{week--;render()};next.onclick=()=>{week++;render()};today.onclick=()=>{week=0;render()};quote();render();</script></body></html>
